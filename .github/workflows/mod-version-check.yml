name: Mod Version Check

on:
  schedule:
    # 每4小时运行一次 (UTC时间)
    - cron: '0 */3 * * *'
  workflow_dispatch: # 允许手动触发
  push:
    branches: [ main, master ]
    paths:
      - 'mod_version_checker.py'
      - '.github/workflows/mod-version-check.yml'

jobs:
  check-mod-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许写入仓库内容
      actions: read    # 允许读取actions
      issues: write    # 允许创建issues
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Check Version.json status
      run: |
        if [ ! -f Version.json ]; then
          echo "{}" > Version.json
          echo "Created new Version.json file"
        else
          echo "Using existing Version.json file from repository"
          echo "Current content:"
          cat Version.json
        fi
        
    - name: Run mod version check
      env:
        WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
      run: |
        python mod_version_checker.py
        
    - name: Upload logs as artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mod-checker-logs-${{ github.run_number }}
        path: |
          mod_checker.log
          Version.json
        retention-days: 30
        
    - name: Commit and push version updates
      if: success()
      run: |
        # 配置Git用户信息
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        # 显示当前状态
        echo "=== Current directory ==="
        pwd
        ls -la

        echo "=== Version.json status ==="
        if [ -f Version.json ]; then
          ls -la Version.json
          echo "Version.json content:"
          cat Version.json
        else
          echo "Version.json not found!"
          exit 1
        fi

        echo "=== Git status ==="
        git status

        # 添加Version.json到Git
        git add Version.json

        # 检查是否有变化需要提交
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          echo "Changes detected, committing..."
          echo "=== Staged changes ==="
          git diff --cached --name-only

          # 提交变化
          git commit -m "Auto-update mod versions - $(date '+%Y-%m-%d %H:%M:%S UTC')"

          # 推送到远程仓库
          echo "Pushing to remote repository..."
          git push origin ${{ github.ref_name }}

          echo "✅ Version.json successfully committed and pushed"
        fi
        
    - name: Create issue on failure
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          const title = `Mod Version Check Failed - ${new Date().toISOString()}`;
          const body = `
          ## Mod版本检查失败
          
          **时间**: ${new Date().toLocaleString('zh-CN', {timeZone: 'Asia/Shanghai'})}
          **工作流**: ${context.workflow}
          **运行ID**: ${context.runId}
          
          请检查以下可能的问题：
          - 网络连接问题
          - Nexus Mods网站变化
          - 企业微信webhook配置
          
          [查看详细日志](${context.payload.repository.html_url}/actions/runs/${context.runId})
          `;
          
          // 检查是否已存在相同的issue
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: ['mod-check-failure']
          });
          
          if (issues.data.length === 0) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['mod-check-failure', 'automated']
            });
          }
